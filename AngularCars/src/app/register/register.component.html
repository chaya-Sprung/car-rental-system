<div class="page">

    <div class="card">
  
      <div class="card-header">
        <h2>Create Account</h2>
        <p>Join our Cars Rental platform</p>
      </div>
  
      <form class="form">
  
        <div class="input-group">
          <input type="text" name="Id" required placeholder=" ">
          <label>ID (Teudat Zehut)</label>
        </div>
  
        <div class="input-group">
          <input type="text" name="firstName" required placeholder=" ">
          <label>First Name</label>
        </div>
  
        <div class="input-group">
          <input type="text" name="lastName" required placeholder=" ">
          <label>Last Name</label>
        </div>
  
        <div class="input-group">
          <input type="number" name="idCity" required placeholder=" ">
          <label>City ID</label>
        </div>
  
        <div class="input-group">
          <input type="email" name="email" required placeholder=" ">
          <label>Email</label>
        </div>
  
        <button type="submit" class="primary-btn">
          Register
        </button>
  
      </form>
  
      <div class="login-link">
        <span>Already registered?</span>
        <a routerLink="/">Back to Login</a>
      </div>
  
    </div>
  
  </div>
